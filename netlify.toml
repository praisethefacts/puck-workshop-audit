[build]
  publish = "."
  functions = "netlify/functions"

# The site is generated locally; Netlify only needs to publish the static files.
# Both API paths are method-specific rewrites to the same dependency-free function.

[[redirects]]
  from = "/api/requests"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/request"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
