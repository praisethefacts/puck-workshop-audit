[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The site is generated by `node scripts/build.mjs` from the committed data files,
# so Netlify only builds and publishes dist/. Both API paths are method-specific
# rewrites to the same dependency-free function.

[[redirects]]
  from = "/api/requests"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/request"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Live audit-run state is polled by the requests page, so it must never be cached.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store"

