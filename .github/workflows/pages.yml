name: Publish mirror

# The site. Free static hosting on GitHub Pages, republished on every commit and
# after every data/audit workflow, so the queue and live triage progress stay visible.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Audit/queue/workflow commits are made with the Actions token, and GitHub does
  # not start a push workflow for those. Republish after them instead.
  workflow_run:
    workflows: ["Sync audit requests", "Update watch", "Audit requested mod", "Site admin"]
    types: [completed]
  schedule:
    - cron: "17 * * * *" # hourly backstop so the mirror never lags the data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        run: npm run build

      - name: Verify
        run: |
          npm run verify
          npm run check:links

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
