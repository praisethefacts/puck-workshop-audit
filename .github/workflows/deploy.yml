name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the audit to Netlify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://puck-workshop-safecheck.netlify.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and verify before publishing
        run: |
          npm run build
          npm run verify
          npm run check:links
          node scripts/validate-data.mjs

      - name: Deploy production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets are required."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --functions=netlify/functions \
            --message "Deploy ${GITHUB_SHA::7} from GitHub Actions"
